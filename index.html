<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="PetPal Academy privacy policy in English and Dutch."
    />
    <title>PetPal Academy Privacy Policy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --primary: #57bee8;
        --intro-primary: #57bee8;
        --secondary: #ff8e4e;
        --background: #f0f4f8;
        --text-primary: #2d3436;
        --text-secondary: #636e72;
        --line: rgba(45, 52, 54, 0.08);
        --shadow: 0 22px 48px rgba(67, 98, 122, 0.14);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Nunito", "Avenir Next", "Segoe UI", sans-serif;
        color: var(--text-primary);
        background:
          radial-gradient(circle at top left, rgba(87, 190, 232, 0.24), transparent 26%),
          radial-gradient(circle at 88% 14%, rgba(87, 190, 232, 0.2), transparent 18%),
          radial-gradient(circle at 15% 85%, rgba(255, 142, 78, 0.12), transparent 18%),
          linear-gradient(180deg, #e0f7fa 0%, #fdf3d0 100%);
      }

      body::before,
      body::after {
        content: "";
        position: fixed;
        z-index: 0;
        border-radius: 999px;
        filter: blur(12px);
        opacity: 0.55;
        pointer-events: none;
      }

      body::before {
        top: 92px;
        right: 7vw;
        width: 180px;
        height: 180px;
        background: rgba(255, 142, 78, 0.26);
      }

      body::after {
        left: 6vw;
        bottom: 86px;
        width: 220px;
        height: 220px;
        background: rgba(87, 190, 232, 0.18);
      }

      a {
        color: var(--primary);
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }

      .page {
        position: relative;
        z-index: 1;
        width: min(1120px, calc(100% - 32px));
        margin: 0 auto;
        padding: 24px 0 64px;
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        margin-bottom: 16px;
      }

      .legal-nav,
      .language-switch {
        display: inline-flex;
        padding: 6px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.66);
        border: 1px solid rgba(255, 255, 255, 0.92);
        box-shadow: 0 12px 28px rgba(47, 74, 95, 0.12);
        backdrop-filter: blur(10px);
      }

      .legal-nav a,
      .language-switch button {
        border: 0;
        background: transparent;
        color: var(--text-secondary);
        font: inherit;
        font-size: 0.95rem;
        font-weight: 800;
        padding: 10px 16px;
        border-radius: 999px;
      }

      .language-switch button {
        cursor: pointer;
      }

      .legal-nav a.active,
      .language-switch button[aria-pressed="true"] {
        color: #fff;
        background: linear-gradient(135deg, var(--primary), #7ad2f1);
        box-shadow: 0 8px 18px rgba(87, 190, 232, 0.28);
      }

      .legal-nav a:hover,
      .language-switch button:hover {
        text-decoration: none;
      }

      .hero {
        display: grid;
        grid-template-columns: minmax(240px, 330px) minmax(0, 1fr);
        gap: 28px;
        align-items: center;
        padding: 26px;
        border-radius: 36px;
        background: rgba(255, 255, 255, 0.7);
        border: 1px solid rgba(255, 255, 255, 0.92);
        box-shadow: var(--shadow);
        backdrop-filter: blur(12px);
      }

      .hero-logo {
        display: grid;
        place-items: center;
        min-height: 280px;
        padding: 20px;
        border-radius: 30px;
        background:
          radial-gradient(circle at top, rgba(255, 255, 255, 0.94), rgba(255, 255, 255, 0.78)),
          linear-gradient(180deg, rgba(255, 255, 255, 0.94), rgba(245, 251, 255, 0.84));
        box-shadow: inset 0 0 0 1px rgba(87, 190, 232, 0.14);
      }

      .hero-logo img {
        width: min(100%, 260px);
        height: auto;
        display: block;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 8px 14px;
        border-radius: 999px;
        color: var(--primary);
        background: rgba(87, 190, 232, 0.14);
        font-size: 0.82rem;
        font-weight: 900;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .eyebrow::before {
        content: "";
        width: 10px;
        height: 10px;
        border-radius: 999px;
        background: linear-gradient(135deg, var(--secondary), #ffc96f);
      }

      h1 {
        margin: 16px 0 12px;
        font-size: clamp(2.2rem, 4.6vw, 4rem);
        line-height: 0.98;
        letter-spacing: -0.04em;
      }

      .hero-copy p {
        margin: 0;
        max-width: 720px;
        color: var(--text-secondary);
        font-size: 1.08rem;
        line-height: 1.65;
        font-weight: 700;
      }

      .hero-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 20px;
      }

      .meta-chip {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 12px 14px;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.82);
        border: 1px solid var(--line);
        color: var(--text-primary);
        font-size: 0.96rem;
        font-weight: 800;
      }

      .meta-chip strong {
        color: var(--primary);
        font-weight: 900;
      }

      .sheet {
        margin-top: 24px;
        padding: 30px;
        border-radius: 40px;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 26px 54px rgba(57, 77, 96, 0.16);
      }

      .sheet-header {
        padding-bottom: 22px;
        border-bottom: 1px solid rgba(45, 52, 54, 0.08);
      }

      .sheet-header h2 {
        margin: 0;
        font-size: 1.55rem;
        line-height: 1.1;
      }

      .sheet-header p {
        margin: 8px 0 0;
        color: var(--text-secondary);
        font-weight: 700;
      }

      .policy-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
        margin-top: 24px;
      }

      .card {
        height: 100%;
        padding: 22px;
        border-radius: 26px;
        background: #fff;
        border: 1px solid rgba(45, 52, 54, 0.06);
        box-shadow: 0 16px 34px rgba(51, 72, 92, 0.08);
      }

      .card h3 {
        margin: 0 0 10px;
        font-size: 1.2rem;
        line-height: 1.2;
      }

      .card p,
      .card ul {
        margin: 0;
        color: var(--text-secondary);
        line-height: 1.7;
        font-size: 1rem;
        font-weight: 700;
      }

      .card ul {
        padding-left: 20px;
      }

      .card li + li {
        margin-top: 8px;
      }

      .contact-card {
        margin-top: 18px;
        padding: 22px;
        border-radius: 28px;
        background: linear-gradient(135deg, rgba(87, 190, 232, 0.16), rgba(87, 190, 232, 0.08));
        border: 1px solid rgba(87, 190, 232, 0.18);
      }

      .contact-card h3 {
        margin: 0;
        font-size: 1.18rem;
      }

      .contact-card p {
        margin: 8px 0 0;
        color: var(--text-secondary);
        font-weight: 700;
        line-height: 1.6;
      }

      @media (max-width: 920px) {
        .hero,
        .policy-grid {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 720px) {
        .page {
          width: min(100% - 20px, 1120px);
          padding-top: 16px;
          padding-bottom: 40px;
        }

        .topbar {
          flex-direction: column;
          align-items: stretch;
        }

        .legal-nav,
        .language-switch {
          justify-content: center;
        }

        .hero,
        .sheet {
          padding: 20px;
          border-radius: 28px;
        }

        .hero {
          grid-template-columns: 1fr;
        }

        .hero-logo {
          min-height: 220px;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <div class="topbar">
        <nav class="legal-nav" aria-label="Legal pages">
          <a class="active" href="./index.html" id="navPrivacy"></a>
          <a href="./terms.html" id="navTerms"></a>
        </nav>
        <div class="language-switch" aria-label="Language switcher">
          <button type="button" data-lang="en" aria-pressed="true">English</button>
          <button type="button" data-lang="nl" aria-pressed="false">Nederlands</button>
        </div>
      </div>

      <section class="hero">
        <div class="hero-logo">
          <img
            src="./assets/petpal_academy_logo_no_background.png"
            alt="PetPal Academy logo"
          />
        </div>

        <div class="hero-copy">
          <div class="eyebrow" id="heroEyebrow"></div>
          <h1 id="heroTitle"></h1>
          <p id="heroLead"></p>

          <div class="hero-meta">
            <div class="meta-chip"><span id="effectiveLabel"></span> <strong id="effectiveDate"></strong></div>
            <div class="meta-chip"><span id="controllerLabel"></span> <strong id="controllerValue"></strong></div>
            <div class="meta-chip"><span id="languageLabel"></span> <strong id="languageValue"></strong></div>
          </div>
        </div>
      </section>

      <section class="sheet">
        <div class="sheet-header">
          <div>
            <h2 id="sheetTitle"></h2>
            <p id="sheetIntro"></p>
          </div>
        </div>

        <div class="policy-grid" id="policyGrid"></div>

        <div class="contact-card">
          <h3 id="contactTitle"></h3>
          <p id="contactDescription"></p>
        </div>
      </section>
    </main>

    <script>
      const content = {
        en: {

          controllerValue: "Guillaume Depraetere",
          languageLabel: "Languages",
          languageValue: "English and Dutch",
          sheetTitle: "How we handle personal data",
          sheetIntro:
            "This notice applies to personal data processed through the PetPal Academy app and related support communications.",

            {

            },
            {
              title: "Data We Collect",
              body:
                "We may collect account information such as your email address and authentication identifiers, pet photos you choose to upload, generated pet teacher images and avatars, child setup details such as age range and selected learning goals, learning progress, subscription status information, support communications, and technical information needed to operate the service."
            },
            {
              title: "How We Use Data",

            {
              title: "Legal Bases",

            },
            {
              title: "Service Providers and Recipients",
              body:
                "We may share personal data with service providers and partners that help operate the app, including providers for authentication, hosting, cloud storage, subscription management, sign-in services, AI generation, and image processing. Personal data is shared only where reasonably necessary for those purposes or where required by law."
            },
            {
              title: "International Transfers",
              body:
                "Some service providers may process personal data outside Belgium or outside the European Economic Area. Where required, appropriate safeguards are used for those transfers, such as contractual protections recognized under applicable data protection law."
            },
            {
              title: "Data Retention",
              body:
                "Personal data is kept for as long as needed to operate the app and fulfill the purposes described in this policy. If you delete your account, associated account data, pet teacher data, learning progress, and stored assets are deleted or anonymized unless retention is required for billing, security, fraud prevention, backups, or legal compliance."

            {

            {
              title: "Your Rights",
              list: [
                "request access to your personal data",
                "request correction of inaccurate personal data",
                "request deletion of personal data in certain circumstances",
                "request restriction of processing in certain circumstances",
                "object to processing based on legitimate interests in certain circumstances",
                "withdraw consent where processing is based on consent",
                "lodge a complaint with a supervisory authority"
              ]
            },
            {
              title: "Complaints",
              body:
                "If you believe your data protection rights have been infringed, you may contact the Belgian Data Protection Authority (Gegevensbeschermingsautoriteit / Autorite de protection des donnees)."
            },
            {
              title: "Website and Cookies",
              body:
                "This legal website is not intended to use analytics cookies or advertising cookies. If that changes in the future, this policy will be updated as needed."
            },
            {
              title: "Changes to This Policy",
              body:
                "This policy may be updated from time to time. The version published on this page is the current version. Material updates may also be communicated through the app where appropriate."
            }
          ],
          contactTitle: "Privacy contact",
          contactDescription:
            "Email: guillaume@gdai.be. Controller: Guillaume Depraetere."
        },
        nl: {
          pageTitle: "PetPal Academy Privacybeleid",
          navPrivacy: "Privacybeleid",
          navTerms: "Gebruiksvoorwaarden",
          heroEyebrow: "PetPal Academy",
          heroTitle: "Privacybeleid",
          heroLead:
            "Dit beleid legt uit hoe persoonsgegevens worden verzameld, gebruikt, gedeeld en bewaard wanneer ouders en verzorgers PetPal Academy gebruiken.",
          effectiveLabel: "Laatst bijgewerkt",
          effectiveDate: "22 maart 2026",
          controllerLabel: "Verwerkingsverantwoordelijke",
          controllerValue: "Guillaume Depraetere",
          languageLabel: "Talen",
          languageValue: "Engels en Nederlands",
          sheetTitle: "Hoe wij persoonsgegevens behandelen",
          sheetIntro:
            "Deze kennisgeving is van toepassing op persoonsgegevens die via de PetPal Academy-app en gerelateerde supportcommunicatie worden verwerkt.",
          sections: [
            {
              title: "Verwerkingsverantwoordelijke en contact",
              body:
                "PetPal Academy wordt aangeboden door Guillaume Depraetere, die optreedt als verwerkingsverantwoordelijke voor de persoonsgegevens die in dit beleid worden beschreven. Voor privacyvragen of verzoeken kunt u contact opnemen via guillaume@gdai.be."
            },
            {
              title: "Welke gegevens we verzamelen",
              body:
                "We kunnen accountgegevens verzamelen zoals uw e-mailadres en authenticatie-ID's, huisdierfoto's die u kiest te uploaden, gegenereerde afbeeldingen en avatars van de huisdierleraar, gegevens over de kindinstellingen zoals leeftijdscategorie en gekozen leerdoelen, leerprogressie, informatie over abonnementsstatus, supportcommunicatie en technische informatie die nodig is om de dienst te laten werken."
            },
            {
              title: "Hoe we gegevens gebruiken",
              body:
                "We gebruiken persoonsgegevens om de app aan te bieden en te onderhouden, de huisdierleraarervaring te maken en te personaliseren, uw account tussen apparaten te synchroniseren, abonnementen te verwerken en te valideren, de beveiliging te behouden, supportvragen te beantwoorden en de dienst te verbeteren."
            },
            {
              title: "Rechtsgronden",
              body:
                "Afhankelijk van de situatie verwerken we persoonsgegevens omdat dit noodzakelijk is om de door u gevraagde dienst uit te voeren, omdat dit noodzakelijk is voor gerechtvaardigde belangen zoals beveiliging en dienstverbetering, omdat u toestemming heeft gegeven waar toestemming vereist is, of omdat verwerking noodzakelijk is om te voldoen aan wettelijke verplichtingen."
            },
            {
              title: "Dienstverleners en ontvangers",
              body:
                "We kunnen persoonsgegevens delen met dienstverleners en partners die helpen om de app te laten werken, waaronder aanbieders voor authenticatie, hosting, cloudopslag, abonnementsbeheer, inlogdiensten, AI-generatie en beeldverwerking. Persoonsgegevens worden alleen gedeeld wanneer dat redelijkerwijs nodig is voor die doeleinden of wanneer de wet dit vereist."
            },
            {
              title: "Internationale doorgiften",
              body:
                "Sommige dienstverleners kunnen persoonsgegevens verwerken buiten Belgie of buiten de Europese Economische Ruimte. Waar vereist worden passende waarborgen gebruikt voor dergelijke doorgiften, zoals contractuele beschermingsmaatregelen die onder het toepasselijke gegevensbeschermingsrecht zijn erkend."
            },
            {
              title: "Bewaartermijnen",
              body:
                "Persoonsgegevens worden bewaard zolang dat nodig is om de app te laten werken en de in dit beleid beschreven doeleinden te vervullen. Als u uw account verwijdert, worden bijbehorende accountgegevens, gegevens van de huisdierleraar, leerprogressie en opgeslagen assets verwijderd of geanonimiseerd, tenzij bewaring vereist is voor facturatie, beveiliging, fraudepreventie, back-ups of wettelijke naleving."
            },
            {
              title: "Beveiliging",
              body:
                "Er worden redelijke technische en organisatorische maatregelen genomen om persoonsgegevens te beschermen tegen ongeoorloofde toegang, verlies, misbruik of wijziging. Geen enkele methode van opslag of overdracht is volledig veilig, maar er worden beveiligingsmaatregelen toegepast die passen bij de aard van de dienst."
            },
            {
              title: "Privacy van kinderen",
              body:
                "PetPal Academy is ontworpen zodat ouders en verzorgers de app voor kinderen instellen. Aankopen worden beschermd door een ouderpoort. Ouders en verzorgers zijn verantwoordelijk voor de informatie die zij via de app verstrekken en mogen alleen content uploaden waarvoor zij toestemming hebben om die te delen."
            },
            {
              title: "Uw rechten",
              list: [
                "toegang vragen tot uw persoonsgegevens",
                "correctie vragen van onjuiste persoonsgegevens",
                "verwijdering vragen van persoonsgegevens in bepaalde omstandigheden",
                "beperking van verwerking vragen in bepaalde omstandigheden",
                "bezwaar maken tegen verwerking op basis van gerechtvaardigde belangen in bepaalde omstandigheden",
                "toestemming intrekken wanneer verwerking op toestemming is gebaseerd",
                "een klacht indienen bij een toezichthoudende autoriteit"
              ]
            },
            {
              title: "Klachten",
              body:
                "Als u van mening bent dat uw gegevensbeschermingsrechten zijn geschonden, kunt u contact opnemen met de Belgische Gegevensbeschermingsautoriteit."
            },
            {
              title: "Website en cookies",
              body:
                "Deze juridische website is niet bedoeld om analysecookies of advertentiecookies te gebruiken. Als dat in de toekomst verandert, wordt dit beleid indien nodig bijgewerkt."
            },
            {
              title: "Wijzigingen in dit beleid",
              body:
                "Dit beleid kan van tijd tot tijd worden bijgewerkt. De versie die op deze pagina wordt gepubliceerd is de actuele versie. Belangrijke wijzigingen kunnen waar passend ook via de app worden meegedeeld."

          contactDescription:
            "E-mail: guillaume@gdai.be. Verwerkingsverantwoordelijke: Guillaume Depraetere."

      };

      const policyGrid = document.getElementById("policyGrid");
      const buttons = document.querySelectorAll("[data-lang]");

      function renderSections(sections) {
        policyGrid.innerHTML = sections
          .map((section) => {
            if (section.list) {
              return `
                <article class="card">
                  <h3>${section.title}</h3>
                  <ul>${section.list.map((item) => `<li>${item}</li>`).join("")}</ul>
                </article>
              `;
            }

            return `
              <article class="card">
                <h3>${section.title}</h3>
                <p>${section.body}</p>
              </article>
            `;
          })
          .join("");
      }

      function setText(id, value) {
        document.getElementById(id).textContent = value;
      }

      function setLanguage(lang) {
        const selected = content[lang];
        document.documentElement.lang = lang;
        document.title = selected.pageTitle;

        setText("navPrivacy", selected.navPrivacy);
        setText("navTerms", selected.navTerms);
        setText("heroEyebrow", selected.heroEyebrow);
        setText("heroTitle", selected.heroTitle);
        setText("heroLead", selected.heroLead);
        setText("effectiveLabel", selected.effectiveLabel);
        setText("effectiveDate", selected.effectiveDate);
        setText("controllerLabel", selected.controllerLabel);
        setText("controllerValue", selected.controllerValue);
        setText("languageLabel", selected.languageLabel);
        setText("languageValue", selected.languageValue);
        setText("sheetTitle", selected.sheetTitle);
        setText("sheetIntro", selected.sheetIntro);
        setText("contactTitle", selected.contactTitle);
        setText("contactDescription", selected.contactDescription);

        renderSections(selected.sections);

        buttons.forEach((button) => {
          const isActive = button.dataset.lang === lang;
          button.setAttribute("aria-pressed", isActive ? "true" : "false");
        });
      }

      buttons.forEach((button) => {
        button.addEventListener("click", () => setLanguage(button.dataset.lang));
      });

      const initialLanguage = navigator.language && navigator.language.toLowerCase().startsWith("nl")
        ? "nl"
        : "en";

      setLanguage(initialLanguage);
    </script>
  </body>
</html>
