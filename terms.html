<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="PetPal Academy terms of service in English and Dutch."
    />
    <title>PetPal Academy Terms of Service</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --primary: #57bee8;
        --intro-primary: #57bee8;
        --secondary: #ff8e4e;
        --background: #f0f4f8;
        --text-primary: #2d3436;
        --text-secondary: #636e72;
        --line: rgba(45, 52, 54, 0.08);
        --shadow: 0 22px 48px rgba(67, 98, 122, 0.14);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Nunito", "Avenir Next", "Segoe UI", sans-serif;
        color: var(--text-primary);
        background:
          radial-gradient(circle at top left, rgba(87, 190, 232, 0.24), transparent 26%),
          radial-gradient(circle at 88% 14%, rgba(87, 190, 232, 0.2), transparent 18%),
          radial-gradient(circle at 15% 85%, rgba(255, 142, 78, 0.12), transparent 18%),
          linear-gradient(180deg, #e0f7fa 0%, #fdf3d0 100%);
      }

      body::before,
      body::after {
        content: "";
        position: fixed;
        z-index: 0;
        border-radius: 999px;
        filter: blur(12px);
        opacity: 0.55;
        pointer-events: none;
      }

      body::before {
        top: 92px;
        right: 7vw;
        width: 180px;
        height: 180px;
        background: rgba(255, 142, 78, 0.26);
      }

      body::after {
        left: 6vw;
        bottom: 86px;
        width: 220px;
        height: 220px;
        background: rgba(87, 190, 232, 0.18);
      }

      a {
        color: var(--primary);
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }

      .page {
        position: relative;
        z-index: 1;
        width: min(1120px, calc(100% - 32px));
        margin: 0 auto;
        padding: 24px 0 64px;
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        margin-bottom: 16px;
      }

      .legal-nav,
      .language-switch {
        display: inline-flex;
        padding: 6px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.66);
        border: 1px solid rgba(255, 255, 255, 0.92);
        box-shadow: 0 12px 28px rgba(47, 74, 95, 0.12);
        backdrop-filter: blur(10px);
      }

      .legal-nav a,
      .language-switch button {
        border: 0;
        background: transparent;
        color: var(--text-secondary);
        font: inherit;
        font-size: 0.95rem;
        font-weight: 800;
        padding: 10px 16px;
        border-radius: 999px;
      }

      .language-switch button {
        cursor: pointer;
      }

      .legal-nav a.active,
      .language-switch button[aria-pressed="true"] {
        color: #fff;
        background: linear-gradient(135deg, var(--primary), #7ad2f1);
        box-shadow: 0 8px 18px rgba(87, 190, 232, 0.28);
      }

      .legal-nav a:hover,
      .language-switch button:hover {
        text-decoration: none;
      }

      .hero {
        display: grid;
        grid-template-columns: minmax(240px, 330px) minmax(0, 1fr);
        gap: 28px;
        align-items: center;
        padding: 26px;
        border-radius: 36px;
        background: rgba(255, 255, 255, 0.7);
        border: 1px solid rgba(255, 255, 255, 0.92);
        box-shadow: var(--shadow);
        backdrop-filter: blur(12px);
      }

      .hero-logo {
        display: grid;
        place-items: center;
        min-height: 280px;
        padding: 20px;
        border-radius: 30px;
        background:
          radial-gradient(circle at top, rgba(255, 255, 255, 0.94), rgba(255, 255, 255, 0.78)),
          linear-gradient(180deg, rgba(255, 255, 255, 0.94), rgba(245, 251, 255, 0.84));
        box-shadow: inset 0 0 0 1px rgba(87, 190, 232, 0.14);
      }

      .hero-logo img {
        width: min(100%, 260px);
        height: auto;
        display: block;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 8px 14px;
        border-radius: 999px;
        color: var(--primary);
        background: rgba(87, 190, 232, 0.14);
        font-size: 0.82rem;
        font-weight: 900;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .eyebrow::before {
        content: "";
        width: 10px;
        height: 10px;
        border-radius: 999px;
        background: linear-gradient(135deg, var(--secondary), #ffc96f);
      }

      h1 {
        margin: 16px 0 12px;
        font-size: clamp(2.2rem, 4.6vw, 4rem);
        line-height: 0.98;
        letter-spacing: -0.04em;
      }

      .hero-copy p {
        margin: 0;
        max-width: 720px;
        color: var(--text-secondary);
        font-size: 1.08rem;
        line-height: 1.65;
        font-weight: 700;
      }

      .hero-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 20px;
      }

      .meta-chip {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 12px 14px;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.82);
        border: 1px solid var(--line);
        color: var(--text-primary);
        font-size: 0.96rem;
        font-weight: 800;
      }

      .meta-chip strong {
        color: var(--primary);
        font-weight: 900;
      }

      .sheet {
        margin-top: 24px;
        padding: 30px;
        border-radius: 40px;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 26px 54px rgba(57, 77, 96, 0.16);
      }

      .sheet-header {
        padding-bottom: 22px;
        border-bottom: 1px solid rgba(45, 52, 54, 0.08);
      }

      .sheet-header h2 {
        margin: 0;
        font-size: 1.55rem;
        line-height: 1.1;
      }

      .sheet-header p {
        margin: 8px 0 0;
        color: var(--text-secondary);
        font-weight: 700;
      }

      .policy-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
        margin-top: 24px;
      }

      .card {
        height: 100%;
        padding: 22px;
        border-radius: 26px;
        background: #fff;
        border: 1px solid rgba(45, 52, 54, 0.06);
        box-shadow: 0 16px 34px rgba(51, 72, 92, 0.08);
      }

      .card h3 {
        margin: 0 0 10px;
        font-size: 1.2rem;
        line-height: 1.2;
      }

      .card p,
      .card ul {
        margin: 0;
        color: var(--text-secondary);
        line-height: 1.7;
        font-size: 1rem;
        font-weight: 700;
      }

      .card ul {
        padding-left: 20px;
      }

      .card li + li {
        margin-top: 8px;
      }

      .contact-card {
        margin-top: 18px;
        padding: 22px;
        border-radius: 28px;
        background: linear-gradient(135deg, rgba(87, 190, 232, 0.16), rgba(87, 190, 232, 0.08));
        border: 1px solid rgba(87, 190, 232, 0.18);
      }

      .contact-card h3 {
        margin: 0;
        font-size: 1.18rem;
      }

      .contact-card p {
        margin: 8px 0 0;
        color: var(--text-secondary);
        font-weight: 700;
        line-height: 1.6;
      }

      @media (max-width: 920px) {
        .hero,
        .policy-grid {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 720px) {
        .page {
          width: min(100% - 20px, 1120px);
          padding-top: 16px;
          padding-bottom: 40px;
        }

        .topbar {
          flex-direction: column;
          align-items: stretch;
        }

        .legal-nav,
        .language-switch {
          justify-content: center;
        }

        .hero,
        .sheet {
          padding: 20px;
          border-radius: 28px;
        }

        .hero {
          grid-template-columns: 1fr;
        }

        .hero-logo {
          min-height: 220px;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <div class="topbar">
        <nav class="legal-nav" aria-label="Legal pages">
          <a href="./index.html" id="navPrivacy"></a>
          <a class="active" href="./terms.html" id="navTerms"></a>
        </nav>
        <div class="language-switch" aria-label="Language switcher">
          <button type="button" data-lang="en" aria-pressed="true">English</button>
          <button type="button" data-lang="nl" aria-pressed="false">Nederlands</button>
        </div>
      </div>

      <section class="hero">
        <div class="hero-logo">
          <img
            src="./assets/petpal_academy_logo_no_background.png"
            alt="PetPal Academy logo"
          />
        </div>

        <div class="hero-copy">
          <div class="eyebrow" id="heroEyebrow"></div>
          <h1 id="heroTitle"></h1>
          <p id="heroLead"></p>

          <div class="hero-meta">
            <div class="meta-chip"><span id="effectiveLabel"></span> <strong id="effectiveDate"></strong></div>
            <div class="meta-chip"><span id="providerLabel"></span> <strong id="providerValue"></strong></div>
            <div class="meta-chip"><span id="lawLabel"></span> <strong id="lawValue"></strong></div>
          </div>
        </div>
      </section>

      <section class="sheet">
        <div class="sheet-header">
          <div>
            <h2 id="sheetTitle"></h2>
            <p id="sheetIntro"></p>
          </div>
        </div>

        <div class="policy-grid" id="policyGrid"></div>

        <div class="contact-card">
          <h3 id="contactTitle"></h3>
          <p id="contactDescription"></p>
        </div>
      </section>
    </main>

      const policyGrid = document.getElementById("policyGrid");
      const buttons = document.querySelectorAll("[data-lang]");

      function renderSections(sections) {
        policyGrid.innerHTML = sections
          .map((section) => {
            if (section.list) {
              return `
                <article class="card">
                  <h3>${section.title}</h3>
                  <ul>${section.list.map((item) => `<li>${item}</li>`).join("")}</ul>
                </article>
              `;
            }

            return `
              <article class="card">
                <h3>${section.title}</h3>
                <p>${section.body}</p>
              </article>
            `;
          })
          .join("");
      }

      function setText(id, value) {
        document.getElementById(id).textContent = value;
      }

      function setLanguage(lang) {
        const selected = content[lang];
        document.documentElement.lang = lang;
        document.title = selected.pageTitle;

        setText("navPrivacy", selected.navPrivacy);
        setText("navTerms", selected.navTerms);
        setText("heroEyebrow", selected.heroEyebrow);
        setText("heroTitle", selected.heroTitle);
        setText("heroLead", selected.heroLead);
        setText("effectiveLabel", selected.effectiveLabel);
        setText("effectiveDate", selected.effectiveDate);
        setText("providerLabel", selected.providerLabel);
        setText("providerValue", selected.providerValue);
        setText("lawLabel", selected.lawLabel);
        setText("lawValue", selected.lawValue);
        setText("sheetTitle", selected.sheetTitle);
        setText("sheetIntro", selected.sheetIntro);
        setText("contactTitle", selected.contactTitle);
        setText("contactDescription", selected.contactDescription);

        renderSections(selected.sections);

        buttons.forEach((button) => {
          const isActive = button.dataset.lang === lang;
          button.setAttribute("aria-pressed", isActive ? "true" : "false");
        });
      }

      buttons.forEach((button) => {
        button.addEventListener("click", () => setLanguage(button.dataset.lang));
      });

      const initialLanguage = navigator.language && navigator.language.toLowerCase().startsWith("nl")
        ? "nl"
        : "en";

      setLanguage(initialLanguage);
    </script>
  </body>
</html>
