<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="PetPal Academy turns a child's real pet into a playful learning companion."
    />
    <title>PetPal Academy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --blue: #57bee8;
        --blue-deep: #2e9fcd;
        --sun: #ffc96f;
        --orange: #ff8e4e;
        --mint: #85d7b3;
        --ink: #2d3436;
        --muted: #636e72;
        --line: rgba(45, 52, 54, 0.08);
        --shadow: 0 24px 52px rgba(67, 98, 122, 0.14);
        --surface: rgba(255, 255, 255, 0.82);
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Nunito", "Avenir Next", "Segoe UI", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at top left, rgba(87, 190, 232, 0.24), transparent 28%),
          radial-gradient(circle at 90% 14%, rgba(255, 201, 111, 0.22), transparent 20%),
          radial-gradient(circle at 12% 82%, rgba(133, 215, 179, 0.18), transparent 18%),
          linear-gradient(180deg, #e0f7fa 0%, #fdf3d0 100%);
      }

      body::before,
      body::after {
        content: "";
        position: fixed;
        z-index: 0;
        border-radius: 999px;
        pointer-events: none;
        filter: blur(12px);
        opacity: 0.5;
      }

      body::before {
        top: 86px;
        right: 6vw;
        width: 180px;
        height: 180px;
        background: rgba(87, 190, 232, 0.22);
      }

      body::after {
        left: 6vw;
        bottom: 80px;
        width: 220px;
        height: 220px;
        background: rgba(255, 142, 78, 0.18);
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .page {
        position: relative;
        z-index: 1;
        width: min(1180px, calc(100% - 32px));
        margin: 0 auto;
        padding: 24px 0 56px;
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        margin-bottom: 18px;
      }

      .brandbar,
      .langbar {
        display: inline-flex;
        align-items: center;
        padding: 6px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.68);
        border: 1px solid rgba(255, 255, 255, 0.92);
        box-shadow: 0 12px 28px rgba(47, 74, 95, 0.12);
        backdrop-filter: blur(10px);
      }

      .brandbar a,
      .langbar button {
        border: 0;
        background: transparent;
        color: var(--muted);
        font: inherit;
        font-size: 0.95rem;
        font-weight: 800;
        padding: 10px 16px;
        border-radius: 999px;
      }

      .langbar button {
        cursor: pointer;
      }

      .brandbar a.active,
      .langbar button[aria-pressed="true"] {
        color: #fff;
        background: linear-gradient(135deg, var(--blue), #7ad2f1);
        box-shadow: 0 8px 18px rgba(87, 190, 232, 0.28);
      }

      .hero {
        display: grid;
        grid-template-columns: minmax(0, 1.1fr) minmax(320px, 0.9fr);
        gap: 22px;
      }

      .panel {
        background: var(--surface);
        border: 1px solid rgba(255, 255, 255, 0.9);
        border-radius: 34px;
        box-shadow: var(--shadow);
        backdrop-filter: blur(14px);
      }

      .hero-copy {
        padding: 30px;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 8px 14px;
        border-radius: 999px;
        color: var(--blue-deep);
        background: rgba(87, 190, 232, 0.13);
        font-size: 0.82rem;
        font-weight: 900;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .eyebrow::before {
        content: "";
        width: 10px;
        height: 10px;
        border-radius: 999px;
        background: linear-gradient(135deg, var(--orange), var(--sun));
      }

      h1 {
        margin: 18px 0 14px;
        font-size: clamp(2.6rem, 5.6vw, 5rem);
        line-height: 0.95;
        letter-spacing: -0.05em;
      }

      .lead {
        margin: 0;
        max-width: 680px;
        color: var(--muted);
        font-size: 1.14rem;
        line-height: 1.7;
        font-weight: 700;
      }

      .hero-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        margin-top: 24px;
      }

      .button,
      .button-muted {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 50px;
        padding: 0 20px;
        border-radius: 18px;
        font-size: 1rem;
        font-weight: 900;
      }

      .button {
        color: #fff;
        background: linear-gradient(135deg, var(--blue), #7ad2f1);
        box-shadow: 0 16px 28px rgba(87, 190, 232, 0.24);
      }

      .button-muted {
        color: var(--ink);
        background: rgba(255, 255, 255, 0.94);
        border: 1px solid var(--line);
      }

      .hero-meta {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
        margin-top: 24px;
      }

      .meta {
        padding: 16px;
        border-radius: 22px;
        background: rgba(255, 255, 255, 0.78);
        border: 1px solid rgba(45, 52, 54, 0.06);
      }

      .meta-label {
        color: var(--muted);
        font-size: 0.82rem;
        font-weight: 900;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .meta-value {
        margin-top: 8px;
        font-size: 1.02rem;
        font-weight: 900;
        line-height: 1.35;
      }

      .hero-visual {
        padding: 22px;
        display: grid;
        gap: 16px;
      }

      .logo-stage {
        display: grid;
        place-items: center;
        min-height: 290px;
        padding: 18px;
        border-radius: 28px;
        background:
          radial-gradient(circle at top, rgba(255, 255, 255, 0.98), rgba(255, 255, 255, 0.76)),
          linear-gradient(180deg, rgba(255, 255, 255, 0.96), rgba(245, 251, 255, 0.84));
      }

      .logo-stage img {
        width: min(100%, 280px);
        height: auto;
        display: block;
      }

      .feature-stack {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .pill {
        padding: 16px;
        border-radius: 20px;
        color: var(--ink);
        font-weight: 900;
        font-size: 1rem;
        line-height: 1.35;
      }

      .pill.story {
        background: linear-gradient(135deg, rgba(255, 201, 111, 0.45), rgba(255, 255, 255, 0.82));
      }

      .pill.play {
        background: linear-gradient(135deg, rgba(87, 190, 232, 0.34), rgba(255, 255, 255, 0.82));
      }

      .pill.create {
        background: linear-gradient(135deg, rgba(255, 142, 78, 0.32), rgba(255, 255, 255, 0.82));
      }

      .pill.explore {
        background: linear-gradient(135deg, rgba(133, 215, 179, 0.34), rgba(255, 255, 255, 0.82));
      }

      .section {
        margin-top: 22px;
      }

      .section-head {
        margin-bottom: 16px;
        padding: 0 4px;
      }

      .section-head h2 {
        margin: 0;
        font-size: 2rem;
        letter-spacing: -0.04em;
      }

      .section-head p {
        margin: 8px 0 0;
        color: var(--muted);
        font-size: 1.02rem;
        font-weight: 700;
        line-height: 1.6;
      }

      .grid-3,
      .grid-4,
      .grid-2 {
        display: grid;
        gap: 16px;
      }

      .grid-3 {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .grid-4 {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

      .grid-2 {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .card {
        padding: 22px;
        border-radius: 28px;
        background: rgba(255, 255, 255, 0.86);
        border: 1px solid rgba(255, 255, 255, 0.92);
        box-shadow: 0 18px 38px rgba(51, 72, 92, 0.08);
      }

      .card h3 {
        margin: 0 0 10px;
        font-size: 1.22rem;
        line-height: 1.2;
      }

      .card p,
      .card ul {
        margin: 0;
        color: var(--muted);
        font-size: 1rem;
        line-height: 1.7;
        font-weight: 700;
      }

      .card ul {
        padding-left: 20px;
      }

      .card li + li {
        margin-top: 8px;
      }

      .timeline {
        display: grid;
        gap: 14px;
      }

      .step {
        display: grid;
        grid-template-columns: 62px minmax(0, 1fr);
        gap: 14px;
        align-items: start;
      }

      .step-badge {
        display: grid;
        place-items: center;
        width: 62px;
        height: 62px;
        border-radius: 22px;
        background: linear-gradient(135deg, rgba(87, 190, 232, 0.18), rgba(255, 201, 111, 0.28));
        color: var(--blue-deep);
        font-size: 1.1rem;
        font-weight: 900;
      }

      .mini-note {
        margin-top: 16px;
        padding: 18px 20px;
        border-radius: 24px;
        background: linear-gradient(135deg, rgba(87, 190, 232, 0.14), rgba(133, 215, 179, 0.12));
        border: 1px solid rgba(87, 190, 232, 0.16);
        color: var(--ink);
        font-weight: 800;
        line-height: 1.6;
      }

      footer {
        margin-top: 20px;
        padding: 22px 24px;
        border-radius: 28px;
        background: rgba(255, 255, 255, 0.82);
        border: 1px solid rgba(255, 255, 255, 0.92);
        box-shadow: 0 18px 38px rgba(51, 72, 92, 0.08);
      }

      .footer-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 12px 20px;
      }

      .footer-copy {
        color: var(--muted);
        font-size: 0.98rem;
        font-weight: 700;
        line-height: 1.6;
      }

      .footer-links {
        display: inline-flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .footer-links a {
        display: inline-flex;
        align-items: center;
        min-height: 42px;
        padding: 0 14px;
        border-radius: 999px;
        background: rgba(87, 190, 232, 0.12);
        color: var(--blue-deep);
        font-weight: 900;
      }

      @media (max-width: 980px) {
        .hero,
        .grid-3,
        .grid-4,
        .grid-2 {
          grid-template-columns: 1fr;
        }

        .hero-meta,
        .feature-stack {
          grid-template-columns: 1fr 1fr;
        }
      }

      @media (max-width: 720px) {
        .page {
          width: min(100% - 20px, 1180px);
          padding-top: 16px;
          padding-bottom: 40px;
        }

        .topbar {
          flex-direction: column;
          align-items: stretch;
        }

        .brandbar,
        .langbar {
          justify-content: center;
          flex-wrap: wrap;
        }

        .hero-copy,
        .hero-visual,
        .card,
        footer {
          padding: 20px;
        }

        .hero-meta,
        .feature-stack {
          grid-template-columns: 1fr;
        }

        .step {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>

    <main class="page">
      <div class="topbar">
        <nav class="brandbar" aria-label="Site navigation">

          <a href="https://privacy.petpalacademy.com/terms.html" id="navTerms"></a>
        </nav>
        <div class="langbar" aria-label="Language switcher">
          <button type="button" data-lang="en" aria-pressed="true">English</button>
          <button type="button" data-lang="nl" aria-pressed="false">Nederlands</button>
        </div>
      </div>

      <section class="hero">
        <div class="panel hero-copy">
          <div class="eyebrow" id="eyebrow"></div>
          <h1 id="heroTitle"></h1>
          <p class="lead" id="heroLead"></p>

          <div class="hero-meta">
            <div class="meta">

              <div class="meta-value" id="meta1Value"></div>

            <div class="meta">

              <div class="meta-value" id="meta2Value"></div>
            </div>
            <div class="meta">

        <div class="panel hero-visual">

      </section>

      <section class="section" id="features">

        </div>
        <div class="grid-4" id="featureGrid"></div>
      </section>

      <section class="section">
        <div class="grid-2">
          <div>
            <div class="section-head">

              <p id="journeyLead"></p>
            </div>
            <div class="card timeline" id="journeySteps"></div>
          </div>
          <div>
            <div class="section-head">

              <p id="parentsLead"></p>
            </div>
            <div class="grid-3" id="parentGrid"></div>
            <div class="mini-note" id="parentNote"></div>
          </div>
        </div>
      </section>

      <section class="section">
        <div class="section-head">
          <h2 id="whyTitle"></h2>
          <p id="whyLead"></p>
        </div>
        <div class="grid-3" id="whyGrid"></div>
      </section>

      <footer>

          <div class="footer-copy" id="footerCopy"></div>
          <div class="footer-links">
            <a href="https://privacy.petpalacademy.com/" id="footerPrivacy"></a>
            <a href="https://privacy.petpalacademy.com/terms.html" id="footerTerms"></a>
          </div>
        </div>
      </footer>
    </main>

          whyLead:
            "De app combineert emotionele herkenning met structuur. Het eigen huisdier van een kind trekt meteen de aandacht, terwijl het productontwerp sessies veilig en makkelijk herhaalbaar houdt.",
          why: [
            {
              title: "Emotioneel sterk",
              body:
                "Kinderen herkennen hun eigen huisdier onmiddellijk, waardoor leren persoonlijk aanvoelt in plaats van generiek."
            },
            {
              title: "Geschikt voor korte sessies",
              body:
                "De ervaring is gebouwd voor snelle succesmomenten, zodat gezinnen ze makkelijker in hun echte routine kunnen inpassen."
            },
            {
              title: "Klaar voor een hoofdsite",
              body:
                "Een homepage kan op het hoofddomein staan terwijl juridische documenten op het privacy-subdomein blijven."
            }
          ],
          footerCopy:
            "Aanbevolen structuur: hoofdsite op petpalacademy.com of www.petpalacademy.com, juridische pagina's op privacy.petpalacademy.com.",
          footerPrivacy: "Privacybeleid",
          footerTerms: "Gebruiksvoorwaarden"
        }
      };

      const featureGrid = document.getElementById("featureGrid");
      const journeySteps = document.getElementById("journeySteps");
      const parentGrid = document.getElementById("parentGrid");
      const whyGrid = document.getElementById("whyGrid");
      const buttons = document.querySelectorAll("[data-lang]");

      function setText(id, value) {
        document.getElementById(id).textContent = value;
      }

      function renderCards(target, items) {
        target.innerHTML = items
          .map(
            (item) => `
              <article class="card">
                <h3>${item.title}</h3>
                <p>${item.body}</p>
              </article>
            `
          )
          .join("");
      }

      function renderJourney(items) {
        journeySteps.innerHTML = items
          .map(
            (item) => `
              <div class="step">
                <div class="step-badge">${item.number}</div>
                <div>
                  <h3>${item.title}</h3>
                  <p>${item.body}</p>
                </div>
              </div>
            `
          )
          .join("");
      }

      function setLanguage(lang) {
        const selected = content[lang];
        document.documentElement.lang = lang;
        document.title = selected.title;

        setText("navHome", selected.navHome);
        setText("navPrivacy", selected.navPrivacy);
        setText("navTerms", selected.navTerms);
        setText("eyebrow", selected.eyebrow);
        setText("heroTitle", selected.heroTitle);
        setText("heroLead", selected.heroLead);
        setText("primaryAction", selected.primaryAction);
        setText("secondaryAction", selected.secondaryAction);
        setText("meta1Label", selected.meta1Label);
        setText("meta1Value", selected.meta1Value);
        setText("meta2Label", selected.meta2Label);
        setText("meta2Value", selected.meta2Value);
        setText("meta3Label", selected.meta3Label);
        setText("meta3Value", selected.meta3Value);
        setText("pill1", selected.pill1);
        setText("pill2", selected.pill2);
        setText("pill3", selected.pill3);
        setText("pill4", selected.pill4);
        setText("featuresTitle", selected.featuresTitle);
        setText("featuresLead", selected.featuresLead);
        setText("journeyTitle", selected.journeyTitle);
        setText("journeyLead", selected.journeyLead);
        setText("parentsTitle", selected.parentsTitle);
        setText("parentsLead", selected.parentsLead);
        setText("parentNote", selected.parentNote);
        setText("whyTitle", selected.whyTitle);
        setText("whyLead", selected.whyLead);
        setText("footerCopy", selected.footerCopy);
        setText("footerPrivacy", selected.footerPrivacy);
        setText("footerTerms", selected.footerTerms);

        renderCards(featureGrid, selected.features);
        renderJourney(selected.journey);
        renderCards(parentGrid, selected.parents);
        renderCards(whyGrid, selected.why);

        buttons.forEach((button) => {
          const isActive = button.dataset.lang === lang;
          button.setAttribute("aria-pressed", isActive ? "true" : "false");
        });
      }

      buttons.forEach((button) => {
        button.addEventListener("click", () => setLanguage(button.dataset.lang));
      });

      const initialLanguage = navigator.language && navigator.language.toLowerCase().startsWith("nl")
        ? "nl"
        : "en";

      setLanguage(initialLanguage);
    </script>
  </body>
</html>
